<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Kost - KostFinder UNKLAB</title>

    <!-- External CSS Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/modern.css">

    <style>
        .booking-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .booking-container {
                grid-template-columns: 1fr;
            }
        }

        .kost-selector {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            height: fit-content;
        }

        .search-box {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: var(--radius-sm);
            margin-bottom: 1rem;
        }

        .kost-list-scroll {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .kost-item-select {
            padding: 10px;
            border: 1px solid #eee;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kost-item-select:hover,
        .kost-item-select.active {
            border-color: var(--primary-color);
            background-color: rgba(108, 99, 255, 0.05);
        }

        .kost-thumb-small {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
        }

        .booking-form-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
        }

        .selected-kost-preview {
            display: flex;
            gap: 1rem;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
        }

        .preview-img {
            width: 100px;
            height: 100px;
            border-radius: var(--radius-sm);
            object-fit: cover;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--secondary-color);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 99, 255, 0.3);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar-glass">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a class="navbar-brand" href="index.html"
                style="font-size: 1.5rem; font-weight: 700; color: var(--secondary-color);">
                Kost<span>Finder</span>
            </a>

            <div class="nav-links">
                <a href="index.html" class="nav-link">Beranda</a>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container" style="padding-top: 100px; padding-bottom: 50px;">
        <h2 class="section-title">Form Booking Kamar</h2>

        <div class="booking-container">
            <!-- Left: Kost Selector -->
            <div class="kost-selector">
                <h4 style="margin-bottom: 1rem;">Pilih Kost</h4>
                <input type="text" id="search-kost" class="search-box" placeholder="Cari nama kost...">
                <div id="kost-list" class="kost-list-scroll">
                    <!-- Items injected by JS -->
                </div>
            </div>

            <!-- Right: Booking Form -->
            <div class="booking-form-card">
                <div id="selected-preview" class="selected-kost-preview" style="display: none;">
                    <img id="preview-img" src="" alt="Kost" class="preview-img">
                    <div>
                        <h4 id="preview-name" style="color: var(--primary-color);">Nama Kost</h4>
                        <p id="preview-price" style="font-weight: 600;">Rp 0</p>
                        <p id="preview-address" style="font-size: 0.9rem; color: var(--text-secondary);">-</p>
                    </div>
                </div>

                <div id="empty-state" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                    <i class="fas fa-home" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.3;"></i>
                    <p>Silakan pilih kost di sebelah kiri terlebih dahulu.</p>
                </div>

                <form id="booking-form" style="display: none;">
                    <div class="form-group">
                        <label class="form-label">Nama Lengkap</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nomor WhatsApp</label>
                        <input type="tel" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tanggal Rencana Masuk</label>
                        <input type="date" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Durasi Sewa (Bulan)</label>
                        <input type="number" min="1" class="form-control" required>
                    </div>

                    <button type="submit" class="btn-submit">Kirim Booking via WhatsApp</button>
                    <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 10px; text-align: center;">
                        Data booking akan dikirimkan langsung ke pemilik kost melalui WhatsApp.
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="modern-footer">
        <div class="container">
            <div style="text-align: center; color: rgba(255,255,255,0.5); font-size: 0.9rem;">
                &copy; 2024 KostFinder UNKLAB. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="scripts/booking.js"></script>
</body>

</html>
