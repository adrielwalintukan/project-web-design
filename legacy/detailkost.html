<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Kost - KostFinder UNKLAB</title>

    <!-- External CSS Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/modern.css">

    <style>
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--secondary-color);
            margin-top: 2rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .back-btn:hover {
            color: var(--primary-color);
            transform: translateX(-5px);
        }

        .detail-container {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 2rem;
            padding-bottom: 4rem;
        }

        @media (max-width: 768px) {
            .detail-container {
                grid-template-columns: 1fr;
            }
        }

        .gallery-container {
            display: grid;
            gap: 1rem;
        }

        .main-image {
            width: 100%;
            height: 400px;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .main-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.2s;
            flex-shrink: 0;
            border: 2px solid transparent;
        }

        .thumbnail:hover,
        .thumbnail.active {
            opacity: 1;
            border-color: var(--primary-color);
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }

        .info-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(0, 0, 0, 0.03);
            position: sticky;
            top: 100px;
        }

        .detail-title {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            color: var(--secondary-color);
            margin-bottom: 0.5rem;
        }

        .detail-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        .detail-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            color: var(--text-secondary);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #f0f2f5;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .section-header {
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .facility-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 2rem;
        }

        .facility-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .facility-item i {
            color: var(--accent-color);
        }

        .action-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            text-align: center;
            border-radius: var(--radius-md);
            font-weight: 600;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .btn-whatsapp {
            background: #25D366;
            color: white;
        }

        .btn-whatsapp:hover {
            background: #128C7E;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-booking {
            background: var(--gradient-primary);
            color: white;
        }

        .btn-booking:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 99, 255, 0.3);
        }

        .map-container iframe {
            width: 100%;
            height: 250px;
            border-radius: var(--radius-md);
            border: none;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar-glass">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a class="navbar-brand" href="index.html"
                style="font-size: 1.5rem; font-weight: 700; color: var(--secondary-color);">
                Kost<span>Finder</span>
            </a>

            <div class="nav-links">
                <a href="index.html" class="nav-link">Beranda</a>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container" style="padding-top: 80px;">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali ke Daftar</a>

        <div class="detail-container">
            <!-- Left: Gallery & Map -->
            <div class="content-left">
                <div class="gallery-container">
                    <div class="main-image">
                        <img id="main-img" src="" alt="Main View">
                    </div>
                    <div class="thumbnail-list" id="thumb-list">
                        <!-- Thumbnails injected here -->
                    </div>
                </div>

                <div class="mt-5">
                    <h3 class="section-header"><i class="fas fa-map-marked-alt"></i> Lokasi</h3>
                    <div class="map-container">
                        <iframe id="map-frame" src="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
            </div>

            <!-- Right: Info -->
            <div class="info-card">
                <h1 id="kost-name" class="detail-title">Nama Kost</h1>
                <div id="kost-price" class="detail-price">Rp 0</div>

                <div class="detail-meta">
                    <span class="meta-item"><i class="fas fa-user-friends"></i> <span id="kost-type">-</span></span>
                    <span class="meta-item"><i class="fas fa-ruler-combined"></i> <span id="kost-size">-</span></span>
                </div>

                <div class="mb-4">
                    <h3 class="section-header"><i class="fas fa-map-marker-alt"></i> Alamat</h3>
                    <p id="kost-address" style="color: var(--text-secondary);">-</p>
                </div>

                <div class="mb-4">
                    <h3 class="section-header"><i class="fas fa-concierge-bell"></i> Fasilitas</h3>
                    <div id="facility-grid" class="facility-grid">
                        <!-- Facilities injected here -->
                    </div>
                </div>

                <a id="btn-wa" href="#" class="action-btn btn-whatsapp" target="_blank">
                    <i class="fab fa-whatsapp"></i> Hubungi Pemilik
                </a>
                <a id="btn-book" href="booking.html" class="action-btn btn-booking">
                    <i class="far fa-calendar-check"></i> Pesan Sekarang
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="modern-footer">
        <div class="container">
            <div style="text-align: center; color: rgba(255,255,255,0.5); font-size: 0.9rem;">
                &copy; 2024 KostFinder UNKLAB. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="scripts/detail.js"></script>
</body>

</html>
